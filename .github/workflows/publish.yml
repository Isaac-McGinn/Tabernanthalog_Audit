name: Deploy Quarto Report

on:
  push:
    branches: [ main ]

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RENV_PATHS_ROOT: ~/.local/share/renv
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4.0'
          use-public-rspm: true  # This enables lightning-fast pre-compiled binaries!

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Install R Package Dependencies
        run: |
          Rscript -e 'install.packages(c("tidyverse", "broom", "emmeans", "pzfx", "here"), repos = "https://packagemanager.posit.co/cran/__linux__/jammy/latest")'

      - name: Render Quarto Report
        run: |
          quarto render report/index.qmd --to html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: report/
          keep_files: true